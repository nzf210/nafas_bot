services:
  redis:
    image: redis:7-alpine
    container_name: nafas_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NAFAS Bot Go Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nafas_api
    ports:
      - "8989:8989"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - APP_PORT=8989
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DB_HOST=shared-postgres-db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBHOOK_URL=${TELEGRAM_WEBHOOK_URL}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - LLM_PROVIDER_URL=${LLM_PROVIDER_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - shared-db-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8989/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  redis_data:

networks:
  default:
    name: nafas_bot_v010_default
  shared-db-network:
    external: true
